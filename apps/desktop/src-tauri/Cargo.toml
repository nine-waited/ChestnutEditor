[package]
name = "chestnut-desktop"
version = "0.9.4"
description = "Chestnut Editor Desktop"
authors = ["Chestnut Contributors"]
edition = "2021"

[lib]
name = "chestnut_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
opener = { version = "0.7", features = ["reveal"] }
trash = "5"
tauri-plugin-clipboard-manager = "2"
clipboard-win = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "6.1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Networking_WinInet"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
