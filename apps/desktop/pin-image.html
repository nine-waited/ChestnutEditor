<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chestnut Pin</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: transparent;
        user-select: none;
      }

      .pin-shell {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 0;
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.7);
        cursor: grab;
      }

      .pin-shell:active {
        cursor: grabbing;
      }

      .pin-close {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 4;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 20px;
        line-height: 28px;
        cursor: pointer;
        opacity: 0;
      }

      .pin-shell:hover .pin-close,
      .pin-close:focus {
        opacity: 1;
      }

      .pin-close:hover {
        background: rgba(220, 38, 38, 0.9);
      }

      .pin-menu {
        position: fixed;
        z-index: 10;
        min-width: 120px;
        padding: 4px;
        border-radius: 8px;
        background: rgba(32, 32, 36, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      .pin-menu[hidden] {
        display: none;
      }

      .pin-menu__item {
        display: block;
        width: 100%;
        margin: 0;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #fff;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      .pin-menu__item:hover,
      .pin-menu__item:focus {
        background: rgba(220, 38, 38, 0.85);
        outline: none;
      }

      .pin-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }

      .pin-handle {
        position: absolute;
        z-index: 3;
        background: rgba(255, 255, 255, 0.01);
      }

      .pin-handle--n {
        top: 0;
        left: 10px;
        right: 10px;
        height: 8px;
        cursor: ns-resize;
      }

      .pin-handle--s {
        bottom: 0;
        left: 10px;
        right: 10px;
        height: 8px;
        cursor: ns-resize;
      }

      .pin-handle--e {
        top: 10px;
        right: 0;
        bottom: 10px;
        width: 8px;
        cursor: ew-resize;
      }

      .pin-handle--w {
        top: 10px;
        left: 0;
        bottom: 10px;
        width: 8px;
        cursor: ew-resize;
      }

      .pin-handle--ne {
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        cursor: nesw-resize;
      }

      .pin-handle--nw {
        top: 0;
        left: 0;
        width: 12px;
        height: 12px;
        cursor: nwse-resize;
      }

      .pin-handle--se {
        bottom: 0;
        right: 0;
        width: 12px;
        height: 12px;
        cursor: nwse-resize;
      }

      .pin-handle--sw {
        bottom: 0;
        left: 0;
        width: 12px;
        height: 12px;
        cursor: nesw-resize;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/pin-image.ts"></script>
  </body>
</html>
